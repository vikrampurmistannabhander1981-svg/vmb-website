<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন প্যানেল | বিক্রমপুর মিষ্টান্ন ভান্ডার</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body{background:var(--bg);}
  .admin-wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px;}
  .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .admin-header img{height:38px;}
  .login-box{max-width:360px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;}
  .login-box h1{font-size:20px;margin:0 0 20px;text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field input, .field select, .field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;}
  .field textarea{min-height:70px;resize:vertical;}
  .err{color:#B3261E;font-size:13.5px;margin:0 0 12px;min-height:18px;}
  .btn{background:var(--navy);color:#fff;padding:12px 22px;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;}
  .btn-gold-s{background:var(--gold);color:#fff;padding:10px 18px;border:none;border-radius:8px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .btn-outline-s{background:#fff;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  th, td{padding:12px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{background:#faf5ea;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  tr:last-child td{border-bottom:none;}
  td img{width:44px;height:44px;object-fit:cover;border-radius:8px;}
  .row-actions{display:flex;gap:8px;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:28px;max-width:480px;width:100%;max-height:90vh;overflow:auto;}
  .modal h2{margin:0 0 18px;font-size:18px;}
  .img-preview{width:100%;height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-bottom:10px;background:#f4ede1;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .muted-note{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .tabs{display:flex;gap:10px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .tab-btn{background:none;border:none;padding:10px 4px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-right:20px;}
  .tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}
  .panel{display:none;}
  .panel.active{display:block;}
</style>
</head>
<body>

<div id="loginScreen" class="admin-wrap">
  <div class="login-box">
    <h1>অ্যাডমিন লগইন</h1>
    <p id="loginErr" class="err"></p>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>
    <button class="btn" style="width:100%;" id="loginBtn">লগইন</button>
  </div>
</div>

<div id="adminScreen" class="admin-wrap" style="display:none;">
  <div class="admin-header">
    <img src="assets/img/logo.png" alt="VMB">
    <button class="btn-outline-s" id="logoutBtn">লগআউট</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="products">মিষ্টি</button>
    <button class="tab-btn" data-tab="branches">ব্রাঞ্চ</button>
  </div>

  <div class="panel active" id="productsPanel">
    <div class="toolbar">
      <h2 style="margin:0;font-size:20px;">মিষ্টি তালিকা</h2>
      <button class="btn-gold-s" id="addBtn">+ নতুন মিষ্টি যোগ করুন</button>
    </div>
    <p id="listErr" class="err"></p>
    <table>
      <thead><tr><th>ছবি</th><th>নাম</th><th>ক্যাটাগরি</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead>
      <tbody id="productRows"></tbody>
    </table>
  </div>

  <div class="panel" id="branchesPanel">
    <div class="toolbar">
      <h2 style="margin:0;font-size:20px;">ব্রাঞ্চ তালিকা</h2>
      <button class="btn-gold-s" id="addBranchBtn">+ নতুন ব্রাঞ্চ যোগ করুন</button>
    </div>
    <p id="branchListErr" class="err"></p>
    <table>
      <thead><tr><th>নাম</th><th>এলাকা</th><th>ঠিকানা</th><th>ফোন</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead>
      <tbody id="branchRows"></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">নতুন মিষ্টি</h2>
    <p id="formErr" class="err"></p>
    <img id="imgPreview" class="img-preview" style="display:none;">
    <div class="field">
      <label>ছবি (ফাইল বাছাই করুন)</label>
      <input type="file" id="imageFile" accept="image/*">
      <div class="muted-note">ছবি স্বয়ংক্রিয়ভাবে ওয়েবসাইটের জন্য উপযুক্ত সাইজে ছোট করা হবে।</div>
    </div>
    <div class="field">
      <label>নাম *</label>
      <input type="text" id="fTitle" placeholder="যেমন: রসগোল্লা">
    </div>
    <div class="field">
      <label>সাব-টাইটেল / ট্যাগ</label>
      <input type="text" id="fSubtitle" placeholder="যেমন: ক্লাসিক">
    </div>
    <div class="field">
      <label>ক্যাটাগরি</label>
      <select id="fCategory">
        <option value="normal">সাধারণ মিষ্টি</option>
        <option value="doi">দই</option>
        <option value="special">স্পেশাল মিষ্টি</option>
        <option value="laddu">লাড্ডু</option>
        <option value="dry">শুকনো আইটেম</option>
        <option value="sondesh">সন্দেশ</option>
      </select>
    </div>
    <div class="field">
      <label>সংক্ষিপ্ত বিবরণ</label>
      <textarea id="fDescription" placeholder="এক-দুই লাইনের বিবরণ"></textarea>
    </div>
    <div class="field">
      <label><input type="checkbox" id="fActive" checked style="width:auto;margin-right:6px;">সাইটে দেখাবে (Active)</label>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn-outline-s" id="cancelBtn">বাতিল</button>
      <button class="btn" id="saveBtn">সেভ করুন</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="branchModalBg">
  <div class="modal">
    <h2 id="branchModalTitle">নতুন ব্রাঞ্চ</h2>
    <p id="branchFormErr" class="err"></p>
    <div class="field">
      <label>ব্রাঞ্চের নাম *</label>
      <input type="text" id="bName" placeholder="যেমন: উত্তরা">
    </div>
    <div class="field">
      <label>এলাকা / থানা</label>
      <input type="text" id="bArea" placeholder="যেমন: উত্তরা">
    </div>
    <div class="field">
      <label>পূর্ণ ঠিকানা</label>
      <textarea id="bAddress" placeholder="বাড়ি/রোড/এলাকা/ঢাকা-পোস্ট কোড"></textarea>
    </div>
    <div class="field">
      <label>ফোন নম্বর</label>
      <input type="text" id="bPhone" placeholder="01XXXXXXXXX">
    </div>
    <div class="field">
      <label><input type="checkbox" id="bActive" checked style="width:auto;margin-right:6px;">সাইটে দেখাবে (Active)</label>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn-outline-s" id="branchCancelBtn">বাতিল</button>
      <button class="btn" id="branchSaveBtn">সেভ করুন</button>
    </div>
  </div>
</div>

<script src="assets/js/admin.js"></script>
</body>
</html>
