<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পেজটি পাওয়া যায়নি | বিক্রমপুর মিষ্টান্ন ভান্ডার</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/logo.png">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .nf{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#14080b;overflow:hidden;padding:40px 24px;}
  .nf img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32;}
  .nf .overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(20,8,11,.3), rgba(20,8,11,.92) 75%);}
  .nf .box{position:relative;max-width:560px;}
  .nf .code{font-size:clamp(90px,18vw,160px);font-weight:700;color:#E3B667;line-height:1;letter-spacing:-4px;opacity:.9;}
  .nf h1{margin:6px 0 12px;color:#fff;font-size:clamp(24px,3.4vw,34px);font-weight:600;}
  .nf p{margin:0 0 28px;color:#D9CFC0;font-size:15.5px;line-height:1.8;}
  .nf .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .nf .logo{height:44px;filter:brightness(0) invert(1);margin:0 auto 20px;opacity:.9;}
</style>
</head>
<body>
<section class="nf">
  <img class="bg" src="/assets/img/hero-1.jpg" alt="">
  <div class="overlay"></div>
  <div class="box">
    <img class="logo" src="/assets/img/logo.png" alt="বিক্রমপুর মিষ্টান্ন ভান্ডার">
    <div class="code disp">৪০৪</div>
    <h1 class="disp">এই পেজটা খুঁজে পাওয়া যায়নি</h1>
    <p>লিংকটা হয়তো বদলে গেছে বা সরিয়ে ফেলা হয়েছে। নিচের যেকোনো পেজে যান — মিষ্টি কিন্তু ঠিক জায়গাতেই আছে।</p>
    <div class="links">
      <a href="/" class="btn-gold" style="padding:13px 24px;">হোমপেজ</a>
      <a href="/sweets" class="btn-outline" style="padding:12px 22px;font-size:14px;">মিষ্টির তালিকা</a>
      <a href="/branches" class="btn-outline" style="padding:12px 22px;font-size:14px;">সব ব্রাঞ্চ</a>
    </div>
  </div>
</section>
</body>
</html>
